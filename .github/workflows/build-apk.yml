name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FocusShield APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Environment
        run: |
          if [ ! -f ./gradlew ] || [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Downloading Gradle to generate wrapper..."
            curl -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
            unzip -q gradle.zip
            ./gradle-8.10.2/bin/gradle wrapper
            rm -rf gradle-8.10.2 gradle.zip
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK Output
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/debug/*.apk build-output/FocusShield-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusShield-APK
          path: build-output/FocusShield-debug.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-${{ github.run_number }}
          name: "FocusShield Release v1.0 (Build ${{ github.run_number }})"
          body: |
            ### 🛡️ FocusShield APK
            - Strict Mode (Anti-Uninstall protection)
            - YouTube Study Mode (Shorts blocker)
            - Whitelist (YouTube & Google allowed)
            - Persistent study timer
          files: build-output/FocusShield-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
